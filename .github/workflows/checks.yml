name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Syntax, paths, and input-validation tests
        run: Rscript tests/run_checks.R
      - name: Validate the real processed inputs
        run: Rscript tools/Validate_Inputs.R
